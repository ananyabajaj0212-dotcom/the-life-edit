<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap');
:root{--bg:#f7f1ed;--paper:#fdfaf7;--panel:#fffdfa;--rose:#b77d83;--rose2:#98656c;--blush:#ead8d4;--brown:#594941;--muted:#9a8980;--line:#eadfd9;--sage:#8b9d84;--shadow:0 8px 28px #765b4c0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--brown);font:14px 'DM Sans',sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid #c18e91;outline-offset:2px}
.app{min-height:100vh}.sidebar{position:fixed;inset:0 auto 0 0;width:258px;background:#f2e9e4;border-right:1px solid var(--line);padding:25px 16px 16px;display:flex;flex-direction:column;overflow:auto;z-index:5}.brand{display:flex;gap:12px;align-items:center;padding:2px 9px 27px}.brand-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#e6ceca;color:var(--rose2);font-size:22px}.brand strong{font-size:12px;letter-spacing:2px}.brand small{display:block;font:italic 12px 'Playfair Display';color:var(--muted);margin-top:3px}.nav-group{margin:18px 0 0}.nav-label{font-size:9px;letter-spacing:1.6px;color:#a18c83;font-weight:700;padding:0 10px 7px}.nav-btn{border:0;background:none;width:100%;padding:9px 10px;border-radius:9px;text-align:left;display:flex;gap:10px;align-items:center;font-size:12px;color:#78675f;margin:2px 0}.nav-btn .ico{width:17px;text-align:center;color:#a8787d;font-size:15px}.nav-btn:hover,.nav-btn.active{background:#ead8d4;color:#79565b;font-weight:700}.nav-bottom{margin-top:auto;padding-top:14px}.profile-mini{border-top:1px solid var(--line);padding:14px 8px 0;display:flex;gap:9px;align-items:center;font-size:11px}.avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#d8b9b5;color:white;font:17px 'Playfair Display'}.profile-mini small{display:block;color:var(--muted);margin-top:3px}
.main{margin-left:258px;min-height:100vh}.topbar{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;font-size:9px;letter-spacing:1.4px;color:var(--muted);position:sticky;top:0;background:#f7f1edeb;backdrop-filter:blur(10px);z-index:3}.topbar .date{font-size:11px;letter-spacing:.3px}.mobile-menu{display:none;border:0;background:none;font-size:19px}.content{max-width:1180px;margin:auto;padding:36px 5% 28px}.welcome{border-radius:17px;background:linear-gradient(115deg,#f0dfdc,#f6ebe6 65%,#eadbd5);padding:33px 38px;min-height:190px;display:flex;justify-content:space-between;align-items:center}.eyebrow{font-size:9px;letter-spacing:1.7px;color:#a18c83;font-weight:700}.welcome h1,.page-head h1{font:500 39px 'Playfair Display';margin:11px 0 7px;color:#594941}.welcome h1 em{color:var(--rose2)}.welcome p,.page-head p{font-size:12px;color:#8e7b72;margin:0}.flower{font-size:85px;color:#c99fa0;opacity:.55;margin-right:20px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0 35px}.quick button{border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:13px;text-align:left;font-size:11px;display:flex;align-items:center;gap:9px}.quick span{font-size:17px;color:var(--rose)}.quick b{margin-left:auto;color:#b59d94}
.section-head,.panel-head,.page-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.section-head{margin-bottom:13px}.section-head h2{font:500 24px 'Playfair Display';margin:5px 0}.pill{background:#f0e5e0;color:#957b73;padding:6px 10px;border-radius:20px;font-size:10px;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:14px}.stat,.panel,.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stat{padding:16px}.stat .top{display:flex;justify-content:space-between;color:#98867d;font-size:10px}.stat .top i{font-style:normal;color:var(--rose);font-size:17px}.stat strong{display:block;font:500 27px 'Playfair Display';margin:12px 0 2px}.stat small{font-size:9px;color:#a18f86}.home-grid{display:grid;grid-template-columns:1.45fr 1fr;gap:13px;margin-bottom:13px}.panel{padding:20px;margin-bottom:13px}.panel h3,.card h3{font:500 19px 'Playfair Display';margin:6px 0 14px}.panel-head{margin-bottom:12px}.panel-head h3{margin:5px 0 0}.blush{background:#f1e3df;border-color:#ead8d4}.blush p{font-size:11px;line-height:1.7;color:#8d7770}.btn{border-radius:8px;padding:9px 14px;font-size:11px;font-weight:600;border:1px solid #d8bfba;background:transparent;color:#946c70}.btn.primary{background:#ae777d;border-color:#ae777d;color:white}.btn.primary:hover{background:#98656c}.btn.text{border:0;padding:5px;background:none}.btn.danger{color:#bd8b8d;border:0;background:none;padding:5px}.row{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:1px solid #f0e9e4;font-size:11px}.row-main{flex:1;min-width:0}.row-main b{font-size:12px}.row-main small{display:block;color:#a18f86;font-size:9px;margin-top:4px}.check{width:17px;height:17px;border:1px solid #d8bdb8;background:transparent;border-radius:50%;display:grid;place-items:center;color:white;font-size:10px;padding:0;flex:none}.check.done{background:#91a388;border-color:#91a388}.muted{color:#a79790!important}.strike{text-decoration:line-through}.empty{text-align:center;padding:28px 10px;color:#a18f86;font-size:11px}.empty i{display:block;font-style:normal;color:#c69b9d;font-size:24px;margin-bottom:8px}
.page-head{margin-bottom:25px}.page-head h1{font-size:36px;margin:7px 0}.toolbar{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:15px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;margin-bottom:13px;font-size:10px;color:#8f7b72}.field input,.field select,.field textarea{width:100%;border:1px solid #e5d9d3;background:#fffdfa;border-radius:7px;padding:10px;color:#584941;font-size:11px}.field textarea{min-height:82px;resize:vertical}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px}.form-grid .wide{grid-column:1/-1}.form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px;margin-top:5px}
.filter{display:flex;gap:6px;flex-wrap:wrap}.filter button{border:1px solid var(--line);background:#fbf8f5;color:#987f77;padding:7px 11px;border-radius:20px;font-size:10px}.filter button.active{background:#ead8d4;color:#805b60;border-color:#ead8d4}
.timeline .slot{display:grid;grid-template-columns:65px 1fr;min-height:39px;border-top:1px solid #f0e9e4}.slot>span{font-size:9px;color:#a18f86;padding-top:12px}.slot>div{padding:5px}.time-chip{display:inline-block;background:#f0dfdc;color:#805f60;border-radius:5px;padding:6px 9px;margin:2px;font-size:9px}
.record-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.record{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--paper)}.record-top{display:flex;justify-content:space-between;align-items:center}.record h3{font:500 18px 'Playfair Display';margin:12px 0 6px}.record p{font-size:10px;line-height:1.7;color:#927f76;white-space:pre-wrap}.record-actions{display:flex;gap:7px;align-items:center}.status{background:#f1e9e4;border-radius:20px;padding:5px 9px;color:#9b7d73;font-size:9px}
.modal-bg{position:fixed;inset:0;background:#3d302d66;display:grid;place-items:center;padding:15px;z-index:20}.modal{width:min(620px,100%);max-height:92vh;overflow:auto;background:#fbf8f5;border-radius:15px;padding:22px;box-shadow:0 20px 70px #46332b30}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal-head h3{font:500 21px 'Playfair Display';margin:0}.modal-head button{border:0;background:none;font-size:24px;color:#a18f86}
.focus-card{background:linear-gradient(145deg,#f1e2de,#f8efeb);border:1px solid #ead8d4;border-radius:18px;text-align:center;padding:35px 18px;margin-bottom:14px}.focus-card input{border:0;background:transparent;text-align:center;font:500 20px 'Playfair Display';color:#604c44;outline:none}.timer{font:500 68px 'Playfair Display';letter-spacing:2px;color:#75585a;margin:13px}.presets{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.presets button{border:1px solid var(--line);background:#fbf8f5;color:#987f77;padding:7px 11px;border-radius:20px;font-size:10px}.presets button.active{background:#ead8d4;color:#805b60}.actions{display:flex;justify-content:center;gap:8px;margin:16px}.note{font-size:10px;color:#9a8980}
.progress{height:5px;background:#eee3de;border-radius:5px;overflow:hidden}.progress span{display:block;height:100%;background:#b77d83}
.footer{text-align:center;color:#b2a097;font-size:9px;letter-spacing:1.4px;padding:22px}.toast{position:fixed;right:20px;bottom:20px;background:#5c4944;color:white;padding:12px 17px;border-radius:8px;font-size:11px;z-index:30}
.mobile-nav{display:none}
@media(max-width:950px){.sidebar{width:220px}.main{margin-left:220px}.stats{grid-template-columns:repeat(2,1fr)}.home-grid{grid-template-columns:1fr}}
@media(max-width:650px){.sidebar{display:none}.main{margin:0}.topbar{height:55px;padding:0 15px}.mobile-menu{display:block}.crumb{font-size:8px}.content{padding:22px 14px 28px}.welcome{padding:24px 20px;min-height:155px}.welcome h1{font-size:31px}.flower{font-size:60px;margin:0}.quick{grid-template-columns:repeat(2,1fr);margin-bottom:28px}.quick button{padding:11px 9px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:23px}.page-head{align-items:flex-start}.page-head h1{font-size:30px}.page-head .btn{white-space:nowrap;padding:8px}.panel{padding:15px}.record-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.form-actions{grid-column:auto}.toolbar{align-items:flex-start;flex-direction:column}.timer{font-size:55px}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:8;background:#f7f1edf2;backdrop-filter:blur(12px);border-top:1px solid var(--line);justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}.mobile-nav button{border:0;background:none;color:#927b73;font-size:9px;display:grid;gap:3px;justify-items:center}.mobile-nav span{font-size:17px}.content{padding-bottom:88px}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
 <div class="brand"><div class="brand-icon">✳</div><div><strong>THE LIFE EDIT</strong><small>A space to become</small></div></div>
 <div id="nav"></div>
 <div class="nav-bottom"><button class="nav-btn" data-page="settings"><span class="ico">⚙</span>Settings</button><div class="profile-mini"><div class="avatar" id="avatar">A</div><div><b id="profileName">Ananya Bajaj</b><small>Personal workspace</small></div></div></div>
</aside>
<main class="main">
<header class="topbar"><button class="mobile-menu" id="menuBtn">☰</button><div class="crumb">YOUR SPACE　/　<span id="crumb">OVERVIEW</span></div><div class="date" id="topDate"></div></header>
<div id="view"></div>
<footer class="footer">THE LIFE EDIT　·　Make room for what matters.</footer>
</main>
<nav class="mobile-nav"><button data-page="home"><span>⌂</span>Home</button><button data-page="daily"><span>◷</span>Day</button><button data-page="calendar"><span>▦</span>Calendar</button><button data-page="focus"><span>◉</span>Focus</button><button data-page="more"><span>☰</span>More</button></nav>
</div>
<div id="modalRoot"></div><div id="toast" class="toast" hidden></div>
<script>
const GROUPS=[
["MY DAY",[["daily","◷","Daily Planner"],["calendar","▦","Calendar"],["focus","◉","Focus Studio"]]],
["MY STUDIES",[["ca","▤","CA Intermediate"],["pending","☷","Pending Work"]]],
["MY WELLNESS",[["habits","♡","Habits"],["fitness","⌁","Fitness"],["nutrition","❋","Nutrition"],["sleep","☾","Sleep & Routine"],["mood","☼","Mood Journal"]]],
["MY GROWTH",[["goals","✧","Goals & Vision Board"],["projects","◇","Projects & Career"]]],
["MY WORKSPACE",[["notes","▧","Notes & Brain Dump"],["weekly","▦","Weekly Planner"],["monthly","▦","Monthly Planner"]]],
["MY INSIGHTS",[["reviews","⌑","Weekly Reviews & Monthly Reports"]]]
];
const LABELS=Object.fromEntries(GROUPS.flatMap(g=>g[1].map(x=>[x[0],x[2]])));
const KEY="the-life-edit-final-v1";
const today=()=>new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Kolkata",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random().toString(36).slice(2);
const fresh=()=>({settings:{name:"Ananya Bajaj",tagline:"An intentional space for everything that matters."},tasks:[],ca:[],habits:[],checks:{},fitness:[],nutrition:[],sleep:[],mood:[],goals:[],projects:[],notes:[],events:[],reviews:[],focus:[]});
let state;try{state={...fresh(),...JSON.parse(localStorage.getItem(KEY)||"{}")}}catch{state=fresh()}
let page="home",timer={running:false,remaining:1500,minutes:25,end:0,interval:null,subject:"Focus session"},currentFilter="All";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateFmt=d=>d?new Date(d+"T12:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}):"No date";
function save(){localStorage.setItem(KEY,JSON.stringify(state));$("#profileName").textContent=state.settings.name;$("#avatar").textContent=(state.settings.name||"A")[0].toUpperCase();renderNav()}
function toast(t){let x=$("#toast");x.textContent=t;x.hidden=false;setTimeout(()=>x.hidden=true,2300)}
function nav(){let h="";GROUPS.forEach(([g,items])=>{h+=`<section class="nav-group"><div class="nav-label">${g}</div>${items.map(([p,ico,l])=>`<button class="nav-btn" data-page="${p}"><span class="ico">${ico}</span>${l}${p==="pending"&&pendingCa().length?`<span class="pill">${pendingCa().length}</span>`:""}</button>`).join("")}</section>`});$("#nav").innerHTML=h}
function renderNav(){nav();document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page))}
function go(p){if(p==="more"){toast("Use the menu icon to open all sections.");return}page=p;$("#crumb").textContent=(LABELS[p]||"OVERVIEW").toUpperCase();render();renderNav();window.scrollTo(0,0)}
function add(k,obj){state[k].push({id:id(),createdAt:new Date().toISOString(),...obj});save()}
function update(k,ident,obj){state[k]=state[k].map(x=>x.id===ident?{...x,...obj}:x);save()}
function remove(k,ident){state[k]=state[k].filter(x=>x.id!==ident);save()}
function pendingCa(){return state.ca.filter(x=>x.status!=="Completed")}
function taskForCa(c){return state.tasks.find(t=>t.sourceId===c.id)}
function syncCa(c){let t=taskForCa(c);if(c.status==="Completed"){if(t)remove("tasks",t.id);return}let payload={title:c.topic||c.chapter||c.subject||"CA activity",date:c.dueDate||today(),priority:c.priority||"Medium",done:false,sourceId:c.id,source:"CA Intermediate"};if(t)update("tasks",t.id,payload);else add("tasks",payload)}
function deleteTaskSafe(t){if(t.sourceId){toast("This task is linked to CA Intermediate. Edit or remove its source activity in the CA tracker.");return}remove("tasks",t.id)}
function head(eyebrow,title,desc,action=""){return `<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc||""}</p></div>${action}</div>`}
function panelTitle(kicker,title,right=""){return `<div class="panel-head"><div><div class="eyebrow">${kicker}</div><h3>${title}</h3></div>${right}</div>`}
function empty(t){return `<div class="empty"><i>✧</i>${t}</div>`}
function stat(label,value,sub,ico){return `<div class="stat"><div class="top"><span>${label}</span><i>${ico}</i></div><strong>${value}</strong><small>${sub}</small></div>`}
function home(){let td=state.tasks.filter(t=>t.date===today()),done=td.filter(t=>t.done).length,hab=state.habits.filter(h=>!h.archived),hd=hab.filter(h=>state.checks[h.id+"_"+today()]).length,ca=pendingCa();return `<div class="content"><div class="welcome"><div><div class="eyebrow">A FRESH PAGE · ${dateFmt(today())}</div><h1>Make today <em>count.</em></h1><p>${esc(state.settings.tagline)}</p></div><div class="flower">✳</div></div><div class="quick"><button data-go="daily"><span>＋</span>Add a task <b>↗</b></button><button data-go="notes"><span>▧</span>Write a note <b>↗</b></button><button data-go="focus"><span>◉</span>Start focus <b>↗</b></button><button data-go="calendar"><span>▦</span>Add an event <b>↗</b></button></div><div class="section-head"><div><div class="eyebrow">YOUR DAY, AT A GLANCE</div><h2>Today’s overview</h2></div><span class="pill">${dateFmt(today())}</span></div><div class="stats">${stat("Tasks to do",state.tasks.filter(t=>!t.done).length,"Across your workspace","☷")}${stat("CA activities",ca.length,"Still in progress","▤")}${stat("Habits today",`${hd}/${hab.length}`,"A little consistency","♡")}${stat("Today's tasks",`${done}/${td.length}`,"Completed today","✧")}</div><div class="home-grid"><div class="panel">${panelTitle("YOUR PRIORITIES","Today’s tasks",`<button class="btn text" data-go="daily">View planner ↗</button>`)}${td.length?td.slice(0,6).map(t=>`<div class="row"><button class="check ${t.done?"done":""}" data-toggle-task="${t.id}">${t.done?"✓":""}</button><div class="row-main"><b class="${t.done?"strike muted":""}">${esc(t.title)}</b><small>${esc(t.priority||"Medium")}</small></div></div>`).join(""):empty("Your day is yours to shape.")}</div><div class="panel blush">${panelTitle("A GENTLE REMINDER","Progress over perfection.")}<p>Small, intentional steps add up. You don’t have to do everything today.</p><button class="btn" data-go="mood">Check in with yourself ↗</button></div></div><div class="panel">${panelTitle("KEEP MOVING FORWARD","CA Intermediate · Pending activities",`<button class="btn text" data-go="ca">Open tracker ↗</button>`)}${ca.length?ca.slice(0,4).map(x=>`<div class="row"><span>✧</span><div class="row-main"><b>${esc(x.topic||x.chapter||"Untitled activity")}</b><small>${esc(x.subject)} · Due ${dateFmt(x.dueDate)}</small></div></div>`).join(""):empty("Your CA tracker is ready when you are.")}</div></div>`}
function field(label,name,type="text",value="",opts=[]){let input=type==="textarea"?`<textarea name="${name}">${esc(value)}</textarea>`:type==="select"?`<select name="${name}"><option value="">Choose…</option>${opts.map(o=>`<option ${value===o?"selected":""}>${esc(o)}</option>`).join("")}</select>`:`<input name="${name}" type="${type}" value="${esc(value)}">`;return `<label class="field"><span>${label}</span>${input}</label>`}
function modal(title,fields,submitLabel="Save"){return `<div class="modal-bg" id="modalBg"><div class="modal"><div class="modal-head"><h3>${title}</h3><button data-close>×</button></div><form id="entryForm" class="form-grid">${fields}<div class="form-actions"><button type="button" class="btn" data-close>Cancel</button><button class="btn primary">${submitLabel}</button></div></form></div></div>`}
function openForm(title,fields,onSave){$("#modalRoot").innerHTML=modal(title,fields);$("#modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg"||e.target.closest("[data-close]"))$("#modalRoot").innerHTML=""});$("#entryForm").onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));onSave(f);$("#modalRoot").innerHTML="";render()}}
function daily(){let date=window.dailyDate||today(),ts=state.tasks.filter(t=>t.date===date);return `<div class="content">${head("MY DAY","Daily Planner","Give your day a little structure, and leave room to breathe.",`<button class="btn primary" data-add-task>＋ Add task</button>`)}<div class="toolbar"><label class="field">Choose a day<input id="dayDate" type="date" value="${date}"></label><span class="pill">${ts.filter(t=>t.done).length} of ${ts.length} complete</span></div><div class="panel">${panelTitle("YOUR TASK LIST",dateFmt(date),`<span class="pill">${ts.length} tasks</span>`)}${ts.length?ts.map(t=>`<div class="row"><button class="check ${t.done?"done":""}" data-toggle-task="${t.id}">${t.done?"✓":""}</button><div class="row-main"><b class="${t.done?"strike muted":""}">${esc(t.title)}</b><small>${t.startTime&&t.dueTime?`${t.startTime}–${t.dueTime} · `:""}${esc(t.priority||"Medium")} ${t.notes?"· "+esc(t.notes):""}</small></div><button class="btn text" data-edit-task="${t.id}">✎</button><button class="btn danger" data-delete-task="${t.id}">×</button></div>`).join(""):empty("No tasks planned for this day. Add one when you're ready.")}</div><div class="panel">${panelTitle("YOUR TIME","Hourly rhythm")}<div class="timeline">${Array.from({length:17},(_,i)=>i+6).map(h=>`<div class="slot"><span>${new Date(2000,0,1,h).toLocaleTimeString("en-IN",{hour:"numeric",hour12:true})}</span><div>${ts.filter(t=>t.startTime&&t.dueTime&&timeMin(t.startTime)<(h+1)*60&&timeMin(t.dueTime)>h*60).map(t=>`<span class="time-chip">${esc(t.title)}</span>`).join("")}</div></div>`).join("")}</div></div></div>`}
function timeMin(s){let [h,m]=s.split(":").map(Number);return h*60+m}
function addTaskForm(existing){let x=existing||{title:"",date:window.dailyDate||today(),startTime:"",dueTime:"",priority:"Medium",notes:""};openForm(existing?"Edit task":"Add a task",field("Task name","title","text",x.title)+field("Date","date","date",x.date)+field("Start time","startTime","time",x.startTime)+field("End time","dueTime","time",x.dueTime)+field("Priority","priority","select",x.priority,["Low","Medium","High"])+`<div class="wide">${field("Notes","notes","textarea",x.notes)}</div>`,f=>{if(!f.title.trim())return;if(existing)update("tasks",x.id,f);else add("tasks",{...f,done:false});})}
function caPage(){let arr=state.ca.filter(x=>currentFilter==="All"||x.status===currentFilter);return `<div class="content">${head("MY STUDIES","CA Intermediate","Lectures, notes, revisions, practice and teaching practice in one place.",`<button class="btn primary" data-add-ca>＋ Add activity</button>`)}<div class="toolbar"><div class="filter">${["All","Pending","In Progress","Completed"].map(x=>`<button class="${currentFilter===x?"active":""}" data-filter="${x}">${x}</button>`).join("")}</div><span class="pill">${state.ca.length} activities</span></div><div class="panel">${arr.length?arr.map(x=>`<div class="row"><div class="row-main"><b>${esc(x.topic||x.chapter||"Untitled activity")}</b><small>${esc(x.subject)} · ${esc(x.chapter)} · ${esc(x.type)}</small></div><span class="status">${esc(x.status)}</span><small>${dateFmt(x.dueDate)}</small><button class="btn text" data-edit-ca="${x.id}">✎</button><button class="btn danger" data-delete-ca="${x.id}">×</button></div>`).join(""):empty("Your study tracker is blank. Add your first activity.")}</div></div>`}
function caForm(x){x=x||{subject:"",chapter:"",topic:"",type:"Lecture",status:"Pending",dueDate:"",priority:"Medium",duration:"",notesStatus:"",revisionCycle:"",attempted:"",correct:"",confidence:"",notes:""};let f=field("Subject","subject","text",x.subject)+field("Chapter","chapter","text",x.chapter)+field("Topic","topic","text",x.topic)+field("Activity type","type","select",x.type,["Lecture","Notes","Revision","Question Practice","Teaching Practice","PYQ","RTP","MTP","Mock Test","Custom"])+field("Status","status","select",x.status,["Pending","In Progress","Completed"])+field("Due date","dueDate","date",x.dueDate)+field("Priority","priority","select",x.priority,["Low","Medium","High"])+field("Duration (minutes)","duration","number",x.duration)+field("Revision cycle","revisionCycle","number",x.revisionCycle)+field("Notes status","notesStatus","select",x.notesStatus,["Not started","In Progress","Complete"])+field("Questions attempted","attempted","number",x.attempted)+field("Correct answers","correct","number",x.correct)+field("Teaching confidence (1–5)","confidence","number",x.confidence)+`<div class="wide">${field("Notes / reflection","notes","textarea",x.notes)}</div>`;openForm(x.id?"Edit CA activity":"New CA activity",f,values=>{if(values.correct&&values.attempted&&+values.correct>+values.attempted){toast("Correct answers cannot exceed attempted questions.");return}if(values.confidence&&(+values.confidence<1||+values.confidence>5)){toast("Confidence must be between 1 and 5.");return}if(x.id){update("ca",x.id,values);syncCa({...x,...values})}else{let item={id:id(),...values};state.ca.push(item);save();syncCa(item)}})}
function pending(){let a=pendingCa();return `<div class="content">${head("MY STUDIES","Pending Work","A focused view of CA activities that still need attention.")}<div class="panel">${a.length?a.map(x=>`<div class="row"><span>✧</span><div class="row-main"><b>${esc(x.topic||x.chapter||x.subject||"Untitled activity")}</b><small>${esc(x.subject)} · ${esc(x.type)} · Due ${dateFmt(x.dueDate)}</small></div><span class="status">${esc(x.status)}</span><button class="btn text" data-complete-ca="${x.id}">Complete ✓</button></div>`).join(""):empty("Nothing pending here. Take the win.")}</div></div>`}
function habits(){let a=state.habits.filter(x=>!x.archived),arch=state.habits.filter(x=>x.archived);return `<div class="content">${head("MY WELLNESS","Habits","Build gentle rhythms, one day at a time.",`<button class="btn primary" data-add-habit>＋ Add habit</button>`)}<div class="panel">${a.length?a.map(h=>`<div class="row"><button class="check ${state.checks[h.id+"_"+today()]?"done":""}" data-habit-check="${h.id}">${state.checks[h.id+"_"+today()]?"✓":""}</button><div class="row-main"><b>${esc(h.name)}</b><small>${esc(h.frequency)} · ${h.notes?esc(h.notes):" "}</small></div><button class="btn text" data-edit-habit="${h.id}">✎</button><button class="btn text" data-archive-habit="${h.id}">Archive</button><button class="btn danger" data-remove-habit="${h.id}">×</button></div>`).join(""):empty("Start with one small habit you want to nurture.")}</div><div class="panel">${panelTitle("ARCHIVE","Paused habits")}${arch.length?arch.map(h=>`<div class="row"><div class="row-main">${esc(h.name)}</div><button class="btn text" data-restore-habit="${h.id}">Restore</button></div>`).join(""):empty("Archived habits will live here.")}</div></div>`}
function habitForm(h){h=h||{name:"",frequency:"Daily",notes:""};openForm(h.id?"Edit habit":"Add a habit",field("Habit name","name","text",h.name)+field("Frequency","frequency","select",h.frequency,["Daily","Alternate days","Selected weekdays"])+`<div class="wide">${field("Notes","notes","textarea",h.notes)}</div>`,f=>h.id?update("habits",h.id,f):add("habits",{...f,archived:false}))}
function focusPage(){return `<div class="content">${head("MY DAY","Focus Studio","A little protected time for the thing in front of you.")}<div class="focus-card"><div class="eyebrow">YOUR FOCUS SPACE</div><input id="focusSubject" value="${esc(timer.subject)}" ${timer.running?"disabled":""}><div class="timer" id="timerDisplay">${fmtTime(timer.remaining)}</div><div class="presets">${[15,25,45,60].map(m=>`<button class="${timer.minutes===m?"active":""}" data-preset="${m}" ${timer.running?"disabled":""}>${m} min</button>`).join("")}</div><div class="actions"><button class="btn primary" id="timerToggle">${timer.running?"Pause":"Start focus"}</button><button class="btn" id="timerReset">Reset</button></div><p class="note">The timer uses timestamps, so it stays accurate when you switch tabs.</p></div><div class="panel">${panelTitle("YOUR HISTORY","Recent focus sessions")}${state.focus.length?state.focus.slice().reverse().slice(0,12).map(x=>`<div class="row"><div class="row-main"><b>${esc(x.subject)}</b><small>${x.minutes} minutes · ${new Date(x.completedAt).toLocaleString("en-IN")}</small></div></div>`).join(""):empty("Completed focus sessions will appear here.")}</div></div>`}
function fmtTime(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}
function startTimer(){timer.subject=$("#focusSubject")?.value||"Focus session";if(timer.running){timer.remaining=Math.max(0,Math.ceil((timer.end-Date.now())/1000));timer.running=false;clearInterval(timer.interval)}else{timer.end=Date.now()+timer.remaining*1000;timer.running=true;timer.interval=setInterval(tick,400)}render();renderNav()}
function tick(){timer.remaining=Math.max(0,Math.ceil((timer.end-Date.now())/1000));let el=$("#timerDisplay");if(el)el.textContent=fmtTime(timer.remaining);if(timer.remaining<=0){clearInterval(timer.interval);timer.running=false;add("focus",{subject:timer.subject,minutes:timer.minutes,completedAt:new Date().toISOString()});timer.remaining=timer.minutes*60;toast("Focus session complete. Nice work.");render()}}
function resetTimer(){clearInterval(timer.interval);timer.running=false;timer.remaining=timer.minutes*60;render()}
function calendar(){let items=[...state.events.map(x=>({...x,kind:"Event"})),...state.tasks.filter(x=>x.date).map(x=>({...x,title:x.title,kind:"Task"})),...state.ca.filter(x=>x.dueDate).map(x=>({...x,title:x.topic||x.chapter||x.subject, date:x.dueDate,kind:"CA"}))].sort((a,b)=>(a.date||"").localeCompare(b.date||""));return `<div class="content">${head("MY DAY","Calendar","Your dates, deadlines and meaningful moments.",`<button class="btn primary" data-add-event>＋ Add event</button>`)}<div class="panel">${items.length?items.map(x=>`<div class="row"><span>✧</span><div class="row-main"><b>${esc(x.title)}</b><small>${dateFmt(x.date)} ${esc(x.time||"")} · ${x.kind}</small></div></div>`).join(""):empty("Your calendar is waiting for its first event.")}</div></div>`}
const CONFIG={
 fitness:{title:"Fitness",eye:"MY WELLNESS",desc:"Record movement, strength and recovery without pressure.",key:"fitness",fields:[["date","Date","date"],["activity","Activity / exercise","text"],["duration","Duration (minutes)","number"],["sets","Sets","number"],["reps","Reps","number"],["weight","Weight (optional)","number"],["notes","Notes / recovery","textarea"]]},
 nutrition:{title:"Nutrition",eye:"MY WELLNESS",desc:"A calm food and hydration journal.",key:"nutrition",fields:[["date","Date","date"],["mealType","Meal","select:Breakfast,Lunch,Dinner,Snack,Water"],["food","What did you have?","text"],["waterMl","Water (ml)","number"],["notes","Notes","textarea"]]},
 sleep:{title:"Sleep & Routine",eye:"MY WELLNESS",desc:"Notice your rest and create routines that support you.",key:"sleep",fields:[["date","Date","date"],["bedtime","Bedtime","time"],["wakeTime","Wake time","time"],["quality","Sleep quality","select:Restful,Okay,Restless"],["notes","Notes","textarea"]]},
 mood:{title:"Mood Journal",eye:"MY WELLNESS",desc:"A private space to check in with yourself.",key:"mood",fields:[["date","Date","date"],["mood","Mood","select:Great,Good,Okay,Low,Stressed"],["tags","Tags","text"],["gratitude","One thing you're grateful for","textarea"],["entry","Journal entry","textarea"]]},
 goals:{title:"Goals & Vision Board",eye:"MY GROWTH",desc:"Keep your hopes visible and next steps manageable.",key:"goals",fields:[["title","Goal","text"],["category","Category","text"],["deadline","Target date","date"],["milestone","Next milestone","text"],["progress","Progress (%)","number"],["notes","Why it matters","textarea"]]},
 projects:{title:"Projects & Career",eye:"MY GROWTH",desc:"Projects, skills, milestones and opportunities.",key:"projects",fields:[["title","Project / opportunity","text"],["status","Status","select:Not started,In progress,On hold,Complete"],["deadline","Deadline","date"],["nextStep","Next step","text"],["notes","Notes","textarea"]]},
 notes:{title:"Notes & Brain Dump",eye:"MY WORKSPACE",desc:"A soft landing place for ideas and everything on your mind.",key:"notes",fields:[["title","Title","text"],["category","Notebook / tag","text"],["body","Your note","textarea"]]},
 weekly:{title:"Weekly Planner",eye:"MY WORKSPACE",desc:"Shape the week around what matters.",key:"reviews",fields:[["title","This week's focus","text"],["wins","Priorities","textarea"],["notes","Notes","textarea"]]},
 monthly:{title:"Monthly Planner",eye:"MY WORKSPACE",desc:"Zoom out, set intentions and make space.",key:"reviews",fields:[["title","Month / intention","text"],["wins","Key priorities","textarea"],["notes","Notes","textarea"]]},
 reviews:{title:"Weekly Reviews & Monthly Reports",eye:"MY INSIGHTS",desc:"Reflect on what worked and what you would like to adjust.",key:"reviews",fields:[["title","Review title","text"],["wins","Wins","textarea"],["challenges","Challenges","textarea"],["next","Next period's focus","textarea"]]}
};
function generic(p){let c=CONFIG[p],arr=state[c.key]||[];return `<div class="content">${head(c.eye,c.title,c.desc,`<button class="btn primary" data-add-generic="${p}">＋ Add new</button>`)}<div class="record-grid">${arr.slice().reverse().map(x=>`<article class="record"><div class="record-top"><span class="pill">${dateFmt(x.date||x.deadline)||esc(x.category||"Personal")}</span><div class="record-actions"><button class="btn text" data-edit-generic="${p}:${x.id}">✎</button><button class="btn danger" data-delete-generic="${p}:${x.id}">×</button></div></div><h3>${esc(x.title||x.activity||x.food||x.mood||x.mealType||"Untitled entry")}</h3><p>${esc(x.body||x.notes||x.entry||x.gratitude||x.nextStep||x.wins||x.activity||"")}</p>${x.progress!==undefined?`<div class="progress"><span style="width:${Math.max(0,Math.min(100,+x.progress||0))}%"></span></div>`:""}</article>`).join("")||`<div class="panel" style="grid-column:1/-1">${empty("Nothing here yet. Create your first entry when you're ready.")}</div>`}</div></div>`}
function genericForm(p,x){let c=CONFIG[p],fields=c.fields.map(([k,l,t])=>field(l,k,t,x?.[k]??(k==="date"?today():""),t.startsWith("select:")?t.slice(7).split(","):[])).join("");openForm(x?"Edit entry":`Add to ${c.title}`,fields,f=>x?update(c.key,x.id,f):add(c.key,f))}
function settings(){return `<div class="content">${head("YOUR SPACE","Settings","Make this space feel like yours.")}<div class="panel" style="max-width:700px"><h3>Profile</h3><form id="profileForm">${field("Your name","name","text",state.settings.name)}${field("Tagline","tagline","text",state.settings.tagline)}<button class="btn primary">Save profile</button></form></div><div class="panel" style="max-width:700px"><h3>Your data & backups</h3><p class="note">Your entries are saved in this browser on this device. Export a backup regularly. Cloud sync and secure account login are not connected in this version.</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="exportBtn">↓ Export backup (JSON)</button><label class="btn">↑ Restore backup<input id="importFile" type="file" accept="application/json" hidden></label><button class="btn danger" id="resetBtn">Reset all data</button></div></div><div class="panel" style="max-width:700px"><h3>Install this app</h3><p class="note">On iPhone, open the hosted app in Safari → Share → Add to Home Screen. On Mac, use your browser’s Install or Add to Dock option. Offline installation requires a secure hosted URL.</p></div></div>`}
function render(){let html=page==="home"?home():page==="daily"?daily():page==="ca"?caPage():page==="pending"?pending():page==="habits"?habits():page==="focus"?focusPage():page==="calendar"?calendar():page==="settings"?settings():CONFIG[page]?generic(page):home();$("#view").innerHTML=html;bind();renderNav()}
function bind(){
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
 document.querySelectorAll("[data-toggle-task]").forEach(b=>b.onclick=()=>{let t=state.tasks.find(x=>x.id===b.dataset.toggleTask);update("tasks",t.id,{done:!t.done});render()});
 document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>{if(b.dataset.page==="more"){let all=GROUPS.flatMap(g=>g[1]);let menu=all.map(x=>`<button class="nav-btn" data-page="${x[0]}"><span class="ico">${x[1]}</span>${x[2]}</button>`).join("")+`<button class="nav-btn" data-page="settings">⚙ Settings</button>`;$("#modalRoot").innerHTML=`<div class="modal-bg" id="modalBg"><div class="modal"><div class="modal-head"><h3>All sections</h3><button data-close>×</button></div>${menu}</div></div>`;$("#modalBg").onclick=e=>{if(e.target.id==="modalBg"||e.target.closest("[data-close]"))$("#modalRoot").innerHTML=""};$("#modalRoot").querySelectorAll("[data-page]").forEach(n=>n.onclick=()=>{$("#modalRoot").innerHTML="";go(n.dataset.page)})}else go(b.dataset.page)});
 $("#menuBtn")?.addEventListener("click",()=>{let sb=$("#sidebar");sb.style.display=sb.style.display==="flex"?"none":"flex";sb.style.position="fixed";sb.style.zIndex="15";sb.style.boxShadow="10px 0 30px #46332b20"});
 $("#dayDate")?.addEventListener("change",e=>{window.dailyDate=e.target.value;render()});
 $("[data-add-task]")?.addEventListener("click",()=>addTaskForm());
 document.querySelectorAll("[data-edit-task]").forEach(b=>b.onclick=()=>addTaskForm(state.tasks.find(x=>x.id===b.dataset.editTask)));
 document.querySelectorAll("[data-delete-task]").forEach(b=>b.onclick=()=>deleteTaskSafe(state.tasks.find(x=>x.id===b.dataset.deleteTask)));
 document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{currentFilter=b.dataset.filter;render()});
 $("[data-add-ca]")?.addEventListener("click",()=>caForm());
 document.querySelectorAll("[data-edit-ca]").forEach(b=>b.onclick=()=>caForm(state.ca.find(x=>x.id===b.dataset.editCa)));
 document.querySelectorAll("[data-delete-ca]").forEach(b=>b.onclick=()=>{let c=state.ca.find(x=>x.id===b.dataset.deleteCa);if(confirm("Delete this CA activity and its linked pending task?")){state.ca=state.ca.filter(x=>x.id!==c.id);let t=taskForCa(c);if(t)state.tasks=state.tasks.filter(x=>x.id!==t.id);save();render()}});
 document.querySelectorAll("[data-complete-ca]").forEach(b=>b.onclick=()=>{let c=state.ca.find(x=>x.id===b.dataset.completeCa);update("ca",c.id,{status:"Completed"});syncCa({...c,status:"Completed"});render()});
 $("[data-add-habit]")?.addEventListener("click",()=>habitForm());
 document.querySelectorAll("[data-edit-habit]").forEach(b=>b.onclick=()=>habitForm(state.habits.find(x=>x.id===b.dataset.editHabit)));
 document.querySelectorAll("[data-habit-check]").forEach(b=>b.onclick=()=>{let k=b.dataset.habitCheck+"_"+today();state.checks[k]=!state.checks[k];save();render()});
 document.querySelectorAll("[data-archive-habit]").forEach(b=>b.onclick=()=>{update("habits",b.dataset.archiveHabit,{archived:true});render()});
 document.querySelectorAll("[data-restore-habit]").forEach(b=>b.onclick=()=>{update("habits",b.dataset.restoreHabit,{archived:false});render()});
 document.querySelectorAll("[data-remove-habit]").forEach(b=>b.onclick=()=>{if(confirm("Permanently delete this habit?")){remove("habits",b.dataset.removeHabit);render()}});
 document.querySelectorAll("[data-preset]").forEach(b=>b.onclick=()=>{timer.minutes=+b.dataset.preset;timer.remaining=timer.minutes*60;render()});
 $("#timerToggle")?.addEventListener("click",startTimer);$("#timerReset")?.addEventListener("click",resetTimer);
 $("#focusSubject")?.addEventListener("input",e=>timer.subject=e.target.value);
 $("[data-add-event]")?.addEventListener("click",()=>openForm("Add calendar event",field("Event","title")+field("Date","date","date",today())+field("Time","time","time"),f=>add("events",f)));
 document.querySelectorAll("[data-add-generic]").forEach(b=>b.onclick=()=>genericForm(b.dataset.addGeneric));
 document.querySelectorAll("[data-edit-generic]").forEach(b=>b.onclick=()=>{let [p,i]=b.dataset.editGeneric.split(":");genericForm(p,state[CONFIG[p].key].find(x=>x.id===i))});
 document.querySelectorAll("[data-delete-generic]").forEach(b=>b.onclick=()=>{let [p,i]=b.dataset.deleteGeneric.split(":");remove(CONFIG[p].key,i);render()});
 $("#profileForm")?.addEventListener("submit",e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));state.settings={...state.settings,...f};save();toast("Profile updated.");render()});
 $("#exportBtn")?.addEventListener("click",()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="the-life-edit-backup.json";a.click();URL.revokeObjectURL(url)});
 $("#importFile")?.addEventListener("change",e=>{let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d||typeof d!=="object"||!Array.isArray(d.tasks))throw 0;state={...fresh(),...d};save();toast("Backup restored.");render()}catch{toast("This backup file is not valid.")}};r.readAsText(file)});
 $("#resetBtn")?.addEventListener("click",()=>{if(confirm("This will erase all Life Edit data saved in this browser. Export a backup first. Continue?")){state=fresh();save();render();toast("Your workspace has been reset.")}});
}
function init(){let d=new Date();$("#topDate").textContent=d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});save();render()}
document.addEventListener("visibilitychange",()=>{if(timer.running&&!document.hidden)tick()});
init();
</script>
<script>if('serviceWorker' in navigator && location.protocol.startsWith('http')) addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script></body></html>
